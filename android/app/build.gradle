plugins {
    id "com.android.application"
}

abstract class WebContentSync extends Sync {
    @Internal
    abstract DirectoryProperty getGeneratedAssetsDirectory()
}

def generatedWebAssets = layout.buildDirectory.dir("generated/webAssets")
def webRoot = rootProject.projectDir.parentFile

def syncWebContent = tasks.register("syncWebContent", WebContentSync) {
    group = "machine learner"
    description = "Copies the canonical learning website into the Android app assets."
    from(webRoot) {
        include "index.html"
        include "*.css"
        include "*.js"
        include "assets/**"
        include "manim/scene-manifest.json"
        include "manim/scene-manifest.js"
        exclude "assets/**/*.md"
    }
    generatedAssetsDirectory.set(generatedWebAssets)
    into(generatedAssetsDirectory.map { it.dir("site") })
}

android {
    namespace "io.github.machinelearner"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.machinelearner"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    androidResources {
        noCompress += ["wasm", "mjs", "whl", "onnx", "webm", "mp4", "zip"]
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(syncWebContent) { task ->
            task.generatedAssetsDirectory
        }
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.webkit:webkit:1.16.0"

    testImplementation "junit:junit:4.13.2"
}
